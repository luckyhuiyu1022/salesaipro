async function callClaude(messages, system) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ model:"claude-sonnet-4-20250514", max_tokens:1200, system, messages }),
  });
  const d = await res.json();
  return d.content?.map(b=>b.text||"").join("") || "AI 無法回應";
}

function Spark({ data, color, h=34 }) {
  const max = Math.max(...data,1); const W=110;
  const pts = data.map((v,i)=>`${(i/(data.length-1))*W},${h-(v/max)*h}`).join(" ");
  return (
    <svg width={W} height={h} style={{overflow:"visible"}}>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="1.5" strokeLinejoin="round" opacity="0.9"/>
      <polyline points={`0,${h} ${pts} ${W},${h}`} fill={color} fillOpacity="0.12" stroke="none"/>
    </svg>
  );
}

            {!report&&!rptLoading&&(
              <div style={{textAlign:"center",padding:"44px 0",color:"#4a6080"}}>
                <div style={{fontSize:40,marginBottom:10}}>📊</div>
                <div>點擊「生成完整報告」，AI 自動分析 14 個月全通路數據</div>
                <div style={{fontSize:11,marginTop:5,color:"#2a4a6a"}}>三大產品線 × 實體+電商 × 通路結構 × 2026 展望</div>
              </div>
            )}
            {rptLoading&&<div style={{textAlign:"center",padding:"44px 0",color:"#4a6080"}}><div style={{fontSize:40,marginBottom:10}}>🤖</div><div>AI 分析中...</div></div>}
            {report&&<div style={{background:"#060d1a",border:"1px solid #1e3a5f",borderRadius:9,padding:18,whiteSpace:"pre-wrap",fontSize:13,lineHeight:1.9,color:"#cbd5e1",maxHeight:520,overflowY:"auto"}}>{report}</div>}
          </div>
        )}

        {/* ── CHAT ── */}
        {tab==="chat" && (
          <div style={S.card}>
            <div style={S.stit}>🤖 AI 銷售助理</div>
            <div style={{display:"flex",flexDirection:"column",height:500,background:"#060d1a",border:"1px solid #1e3a5f",borderRadius:11,overflow:"hidden"}}>
              <div style={{flex:1,overflowY:"auto",padding:14,display:"flex",flexDirection:"column",gap:9}}>
                {chatMsgs.map((m,i)=><div key={i} style={S.bub(m.role==="user")}>{m.content}</div>)}
                {chatLoading&&<div style={{...S.bub(false),color:"#4a6080"}}>AI 思考中...</div>}
                <div ref={chatEnd}/>
              </div>
              <div style={{display:"flex",gap:7,padding:11,borderTop:"1px solid #1e3a5f",background:"#0a1628"}}>
                <input style={S.inp} value={chatInput} onChange={e=>setChatInput(e.target.value)}
                  onKeyDown={e=>e.key==="Enter"&&sendChat()}
                  placeholder="例：馬艾通路今年表現如何？好市多依賴風險怎麼管理？"/>
                <button style={S.btn} onClick={sendChat} disabled={chatLoading}>{chatLoading?"...":"送出 →"}</button>
              </div>
            </div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:10}}>
              {["馬艾通路整體分析","好市多依賴風險","車用麥克風如何拓展實體？","2026下半年優先策略","中嘉寬頻洽談策略"].map(q=>(
                <button key={q} style={{...S.bsm(),fontSize:11}} onClick={()=>setChatInput(q)}>{q}</button>
              ))}
            </div>
          </div>
        )}

      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
